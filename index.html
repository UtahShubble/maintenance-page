<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .maintenance-card {
            max-width: 600px;
            border-top: 5px solid #0056b3; /* Adjust to your brand primary color */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card shadow-lg border-0 maintenance-card mx-auto p-5 text-center bg-white">
            <img src="Utah Icon.png" alt="Logo" class="mx-auto mb-4" style="max-height: 80px;">
            
            <h1 class="display-6 fw-bold text-dark mb-3">System Upgrade in Progress</h1>
            <p class="lead text-muted mb-4">
                We are currently migrating to our new system. The portal is temporarily unavailable while we transition data and finalize the setup.
            </p>
            
            <div class="alert alert-info" role="alert">
                <strong>Expected Completion:</strong> 10/22/2026 6:00 AM
            </div>

        </div>
    </div>

</body>
</html>
